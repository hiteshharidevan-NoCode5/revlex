<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RevLex — Open-Source Reverse Dictionary</title>
  <meta name="description" content="An open-source, privacy-first reverse dictionary. Offline meaning-to-word finder." />
  <meta name="theme-color" content="#0B0F17" />
  <link rel="manifest" href="manifest.json" />

  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #475569;
      --accent: #1D4ED8;
      --badge-bg: #F1F5F9;
      --badge-text: #334155;
      --input-bg: #FFFFFF;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-serif: Georgia, Cambria, "Times New Roman", serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B0F17;
        --surface: #151E2E;
        --border: #1E293B;
        --text-main: #F1F5F9;
        --text-muted: #94A3B8;
        --accent: #60A5FA;
        --badge-bg: #1E293B;
        --badge-text: #CBD5E1;
        --input-bg: #111827;
      }
    }

    [data-theme="light"] {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #475569;
      --accent: #1D4ED8;
      --badge-bg: #F1F5F9;
      --badge-text: #334155;
      --input-bg: #FFFFFF;
    }

    [data-theme="dark"] {
      --bg: #0B0F17;
      --surface: #151E2E;
      --border: #1E293B;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --accent: #60A5FA;
      --badge-bg: #1E293B;
      --badge-text: #CBD5E1;
      --input-bg: #111827;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1.25rem 1rem;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-left: 0.5rem;
      font-weight: 400;
    }

    .theme-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.3rem 0.6rem;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .search-box {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .query-input {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 1.05rem;
      background-color: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.1s;
    }

    .query-input:focus {
      border-color: var(--accent);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: space-between;
    }

    .pos-tabs {
      display: flex;
      gap: 0.3rem;
    }

    .pos-btn {
      background: var(--badge-bg);
      border: 1px solid var(--border);
      color: var(--badge-text);
      font-size: 0.75rem;
      padding: 0.35rem 0.65rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .pos-btn.active {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    .letter-filter {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .letter-input {
      width: 44px;
      padding: 0.3rem;
      font-size: 0.85rem;
      text-align: center;
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 4px;
      text-transform: uppercase;
    }

    .results-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .word-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.9rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .word-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .headword {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--font-serif);
      letter-spacing: 0.01em;
    }

    .pos-badge {
      font-size: 0.68rem;
      font-style: italic;
      color: var(--badge-text);
      background: var(--badge-bg);
      padding: 0.15rem 0.45rem;
      border-radius: 3px;
    }

    .definition {
      font-size: 0.93rem;
      line-height: 1.5;
      color: var(--text-main);
    }

    .meta-tokens {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .synonym-chip {
      color: var(--text-muted);
      background: var(--badge-bg);
      padding: 0.12rem 0.4rem;
      border-radius: 3px;
      font-size: 0.75rem;
    }

    .empty-state {
      padding: 2.5rem 1rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      border: 1px dashed var(--border);
      border-radius: 6px;
    }

    footer {
      margin-top: auto;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }
  
  
  .result-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .result-word {
    font-size: 1.25rem;
    font-weight: 700;
    color: #60a5fa;
    letter-spacing: -0.01em;
  }
  .result-pos {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 6px;
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
  }
  .result-def {
    font-size: 0.95rem;
    line-height: 1.5;
    color: #e2e8f0;
  }
  .result-related {
    margin-top: 4px;
    padding-top: 8px;
    border-top: 1px solid var(--border-color, #1f293d);
    font-size: 0.82rem;
    color: #94a3b8;
  }
  .result-related strong {
    color: #cbd5e1;
  }

  .openlex-link-row {

    padding-top: 8px;
    border-top: 1px dashed var(--border-color, #222f46);
    display: flex;
    justify-content: flex-end;

  /* Light adaptation overrides */

  .theme-selectors {

</style>

<body>

    


  <main class="app-container">
    <header>
      <div>
        <span class="brand">RevLex</span>
        <span class="tagline">Reverse Meaning Finder</span>
      </div>
      <button class="theme-btn" id="themeToggle" aria-label="Toggle Theme">Theme</button>
    </header>

    <section class="search-box">
      <input 
        type="search" 
        id="queryInput" 
        class="query-input" 
        placeholder="Describe the meaning (e.g. smell after rain, fear of heights)..." 
        autofocus
      />

      <div class="filters">
        <div class="pos-tabs" id="posFilter">
          <button class="pos-btn active" data-pos="all">All</button>
          <button class="pos-btn" data-pos="noun">Noun</button>
          <button class="pos-btn" data-pos="verb">Verb</button>
          <button class="pos-btn" data-pos="adj">Adjective</button>
        </div>

        <div class="letter-filter">
          <label for="letterInput">Starts with:</label>
          <input type="text" id="letterInput" class="letter-input" maxlength="2" placeholder="—" />
        </div>
      </div>
    </section>

    <div class="results-meta" id="resultsCount">Top Matches</div>

    <section class="results-list" id="resultsContainer">
      <div class="empty-state">Enter a definition, concept, or phrase to find candidate words.</div>
    </section>

    <footer>
      <strong>RevLex</strong> — An open-source, offline reverse dictionary.<br>
      Privacy-first • Zero tracking • Companion to OpenLex
    </footer>
  </main>

  <script>
    let db = null;
    const STOPWORDS = new Set(["a", "an", "the", "in", "on", "of", "to", "for", "with", "that", "it", "or", "and", "by", "is", "are"]);

    const queryInput = document.getElementById("queryInput");
    const letterInput = document.getElementById("letterInput");
    const posFilter = document.getElementById("posFilter");
    const resultsContainer = document.getElementById("resultsContainer");
    const resultsCount = document.getElementById("resultsCount");
    const themeToggle = document.getElementById("themeToggle");

    let activePos = "all";

        
    function cleanQuery(raw) {
      let q = raw.toLowerCase().trim();
      // Remove punctuation except hyphens
      q = q.replace(/[^a-z0-9\s-]/g, " ");

      // Conversational prefixes/fillers
      const fillerRegexes = [
        /^what\s+(do\s+you\s+call|is\s+the\s+word\s+for|is\s+it\s+called|is\s+a)\b/i,
        /^how\s+do\s+you\s+(call|describe|name)\b/i,
        /^(a\s+)?(word|term|name)\s+for\b/i,
        /^meaning\s+of\b/i,
        /^someone\s+who\b/i,
        /^a\s+person\s+(who|that|aged|between)?\b/i
      ];

      for (const r of fillerRegexes) {
        q = q.replace(r, " ");
      }

      // Map numeric age phrasing to WordNet/Curated vocabulary
      q = q.replace(/\b(90\s*(-|to)\s*99|90s|nineties)\b/g, " 90 nineties ");
      q = q.replace(/\b(80\s*(-|to)\s*89|80s|eighties)\b/g, " 80 eighties ");
      q = q.replace(/\b(70\s*(-|to)\s*79|70s|seventies)\b/g, " 70 seventies ");
      q = q.replace(/\b(60\s*(-|to)\s*69|60s|sixties)\b/g, " 60 sixties ");
      q = q.replace(/\b(100|100s|hundred)\b/g, " 100 hundred centenarian ");

      // Split into tokens and remove common stopwords
      const stopWords = new Set(["a", "an", "the", "in", "on", "of", "to", "for", "with", "that", "it", "or", "and", "by", "is", "are", "do", "you", "call", "what", "how", "who", "whom", "can", "be", "as", "at", "from"]);
      const tokens = q.split(/\s+/).filter(t => t.length > 1 && !stopWords.has(t));

      return tokens;
    }

    async function initDatabase() {
  const container = document.getElementById("resultsContainer");
  try {
    const { CapacitorSQLite } = window.Capacitor?.Plugins || {};
    if (CapacitorSQLite) {
      await CapacitorSQLite.copyFromAssets({ toVersionFolder: false });
      await CapacitorSQLite.createConnection({ database: "revlex", version: 1, encrypted: false, mode: "no-encryption" });
      await CapacitorSQLite.open({ database: "revlex" });
      db = { query: async (s, v = []) => await CapacitorSQLite.query({ database: "revlex", statement: s, values: v }) };
      console.log("RevLex native SQLite connected!");
    } else {
      if (container) container.innerHTML = '<div class="empty-state">Loading offline database (292k entries)... Please wait.</div>';
      console.log("Initializing SQLite3 WASM with FTS5...");
      const sqlite3 = await sqlite3InitModule();
      console.log("Fetching database for WASM...");
      const res = await fetch("assets/databases/revlex.db");
      const buf = await res.arrayBuffer();
      const wasmDb = new sqlite3.oo1.DB();
      const p = sqlite3.wasm.allocFromTypedArray(new Uint8Array(buf));
      sqlite3.capi.sqlite3_deserialize(wasmDb.pointer, "main", p, buf.byteLength, buf.byteLength, sqlite3.capi.SQLITE_DESERIALIZE_FREEONCLOSE);
      db = { query: async (s, v = []) => { const rows = []; wasmDb.exec({ sql: s, bind: v, rowMode: "object", resultRows: rows }); return { values: rows }; } };
      console.log("RevLex SQLite WASM FTS5 ready!");
    }
    if (container) container.innerHTML = '<div class="empty-state">Database ready! Type a concept above to search.</div>';
  } catch (err) {
    console.error("DB Init Error:", err);
    if (container) container.innerHTML = `<div class="empty-state" style="color:#ff6b6b;font-family:monospace;text-align:left;padding:12px;font-size:13px;"><strong>DB Init Error:</strong><br>${err.message || err}</div>`;
  }
}

    function tokenize(text) {
      return text
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .split(/\s+/)
        .filter(t => t.length > 1 && !STOPWORDS.has(t));
    }

    async function render() {
      const q = queryInput ? queryInput.value.trim() : "";
      const letter = letterInput ? letterInput.value.trim().toLowerCase() : "";

      if (!q) {
        if (resultsCount) resultsCount.textContent = "0 words found";
        if (resultsContainer) {
          resultsContainer.innerHTML = '<div class="empty-state">Type a concept, description, or feeling above to find matching words.</div>';
        }
        return;
      }

      const tokens = tokenize(q);
      if (tokens.length === 0) return;

      if (resultsContainer) {
        resultsContainer.innerHTML = '<div class="loading">Searching offline lexicon...</div>';
      }

      if (!db) {
        if (resultsContainer) {
          resultsContainer.innerHTML = '<div class="empty-state">Database initializing. Open inside installed Android app.</div>';
        }
        return;
      }

      try {
        const ftsQuery = tokens.join(" OR ");
        let querySql = `
          SELECT word, pos, definition, synonyms, bm25(entries_fts, 2.0, 0.0, 5.0, 2.0) AS rank 
          FROM entries_fts 
          WHERE entries_fts MATCH ?
        `;
        const params = [ftsQuery];

        if (activePos !== "all") {
          querySql += " AND pos = ?";
          params.push(activePos);
        }

        if (letter) {
          querySql += " AND word LIKE ?";
          params.push(letter + "%");
        }

        querySql += " ORDER BY rank LIMIT 40;";

        const res = await db.query(querySql, params);
        const entries = res.values || [];

        if (resultsCount) {
          resultsCount.textContent = entries.length + (entries.length === 1 ? " word found" : " words found");
        }

        if (entries.length === 0) {
          resultsContainer.innerHTML = '<div class="empty-state">No matching words found. Try broader descriptive words.</div>';
          return;
        }

        resultsContainer.innerHTML = entries.map(item => `
          <div class="result-card">
            <div class="card-top">
              <span class="word">${item.word}</span>
              <span class="pos">${item.pos || "NOUN"}</span>
            </div>
            <div class="definition">${item.definition}</div>
            ${item.synonyms ? `<div class="synonyms"><span class="syn-label">Related:</span> ${item.synonyms}</div>` : ""}
            <div class="card-action">
              <button type="button" class="openlex-btn" onclick="lookupWord('${item.word.replace(/'/g, "\'")}', '${(item.pos || "").replace(/'/g, "\'")}', '${(item.definition || "").slice(0, 120).replace(/'/g, "\'")}')">Look up in OpenLex ↗</button>
            </div>
          </div>
        `).join("");

      } catch (err) {
        console.error("Search query execution error:", err);
        if (resultsContainer) {
          resultsContainer.innerHTML = '<div class="empty-state">Error querying offline database.</div>';
        }
      }
    }

    if (queryInput) {
      queryInput.addEventListener("input", () => {
        clearTimeout(window._searchTimer);
        window._searchTimer = setTimeout(render, 250);
      });
    }

    if (letterInput) {
      letterInput.addEventListener("input", render);
    }

    if (posFilter) {
      posFilter.addEventListener("click", (e) => {
        if (!e.target.classList.contains("pos-btn")) return;
        document.querySelectorAll(".pos-btn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        activePos = e.target.dataset.pos;
        render();
      });
    }

    if (themeToggle) {
      themeToggle.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
      });
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      initDatabase();
    });
  
      function lookupWord(w, pos, def) {
    if (!w) return;
    var params = new URLSearchParams();
    params.set("q", w.trim().toLowerCase());
    if (pos) params.set("pos", pos.trim().toLowerCase());
    if (def) params.set("context", def.trim());

    var url = "https://hiteshharidevan-nocode5.github.io/openlex/?" + params.toString();
    window.open(url, "_blank");
  }
    
</script>

<script id="revlex-master-cycle-script">
  var themes = ["theme-teal", "theme-wireframe", "theme-light"];

  function updateThemeButtonLabel(current) {
    var labelMap = {
      "theme-teal": "Theme: Teal",
      "theme-wireframe": "Theme: Wireframe",
      "theme-light": "Theme: Light"
    };
    var themeButtons = document.querySelectorAll("header button, .theme-btn, #themeBtn, button");
    themeButtons.forEach(function(b) {
      if (b.innerText.toLowerCase().includes("theme") || b.id === "themeBtn" || b.hasAttribute("data-theme-btn")) {
        b.setAttribute("data-theme-btn", "true");
        b.innerText = labelMap[current] || "Theme: Teal";
      }
    });
  }

  function cycleTheme() {
    var current = "theme-teal";
    for (var i = 0; i < themes.length; i++) {
      if (document.documentElement.classList.contains(themes[i])) {
        current = themes[i];
        break;
      }
    }
    var nextIndex = (themes.indexOf(current) + 1) % themes.length;
    var nextTheme = themes[nextIndex];

    themes.forEach(function(t) { document.documentElement.classList.remove(t); });
    document.documentElement.classList.add(nextTheme);
    try { localStorage.setItem("revlex_theme_mode", nextTheme); } catch(e){}
    updateThemeButtonLabel(nextTheme);
  }

    function lookupWord(w, pos, def) {
    if (!w) return;
    var params = new URLSearchParams();
    params.set("q", w.trim().toLowerCase());
    if (pos) params.set("pos", pos.trim().toLowerCase());
    if (def) params.set("context", def.trim());

    var url = "https://hiteshharidevan-nocode5.github.io/openlex/?" + params.toString();
    window.open(url, "_blank");
  }

  document.addEventListener("DOMContentLoaded", function() {
    var saved = "theme-teal";
    try { saved = localStorage.getItem("revlex_theme_mode") || "theme-teal"; } catch(e){}
    themes.forEach(function(t) { document.documentElement.classList.remove(t); });
    document.documentElement.classList.add(saved);
    updateThemeButtonLabel(saved);

    var btns = document.querySelectorAll("header button, .theme-btn, #themeBtn, button");
    btns.forEach(function(b) {
      if (b.innerText.toLowerCase().includes("theme") || b.id === "themeBtn" || b.hasAttribute("data-theme-btn")) {
        b.setAttribute("data-theme-btn", "true");
        b.onclick = function(e) {
          e.preventDefault();
          cycleTheme();
        };
      }
    });
  });
</script>
